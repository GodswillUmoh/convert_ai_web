<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    RCCG Admin Login
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/styles.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">

  <div class="container">

    <a
      class="navbar-brand fw-bold"
      href="index.html"
    >
      RCCG Convert System
    </a>

  </div>

</nav>

<!-- LOGIN SECTION -->

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-5">

      <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-5">

          <div class="text-center mb-4">

            <h2 class="fw-bold text-danger">
              Admin Login
            </h2>

            <p class="text-muted">
              Only emails found in the Admins table can access the dashboard.
            </p>

          </div>

          <form id="adminLoginForm">

            <!-- EMAIL -->

            <div class="mb-4">

              <label class="form-label fw-semibold">
                Email Address
              </label>

              <input
                type="email"
                class="form-control form-control-lg"
                id="adminEmail"
                placeholder="Enter admin email"
                required
              >

            </div>

            <!-- BUTTON -->

            <div class="d-grid">

              <button
                type="submit"
                class="btn btn-danger btn-lg rounded-4"
                id="loginBtn"
              >
                Access Dashboard
              </button>

            </div>

          </form>

          <!-- MESSAGE -->

          <div
            id="loginMessage"
            class="mt-4"
          ></div>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- BOOTSTRAP -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- LOGIN SCRIPT -->

<script>

const SUPABASE_URL =
  "https://etcybdblmcvdmesiekon.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0Y3liZGJsbWN2ZG1lc2lla29uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxMzkwOTgsImV4cCI6MjA4MzcxNTA5OH0.0Wy2mBn-_-8Wn5x9Xedfjdf8Z_kblbd1_mlRSfJ9HSo";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

// =========================
// ADMIN LOGIN
// =========================

const adminLoginForm =
  document.getElementById(
    "adminLoginForm"
  );

if (adminLoginForm) {

  adminLoginForm.addEventListener(
    "submit",
    async function (e) {

      e.preventDefault();

      const loginBtn =
        document.getElementById(
          "loginBtn"
        );

      const loginMessage =
        document.getElementById(
          "loginMessage"
        );

      loginBtn.disabled = true;

      loginBtn.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Checking Access...
      `;

      const email =
        document
          .getElementById(
            "adminEmail"
          )
          .value
          .trim()
          .toLowerCase();

      try {

        // =========================
        // CHECK ADMINS TABLE
        // =========================

        const {
          data,
          error
        } = await supabaseClient
          .from("admins")
          .select("*")
          .eq("email", email)
          .maybeSingle();

        if (error) {
          throw error;
        }

        // =========================
        // ACCESS DENIED
        // =========================

        if (!data) {

          loginMessage.innerHTML = `
            <div class="alert alert-danger rounded-4">
              Access denied. Email not found in admin system.
            </div>
          `;

          loginBtn.disabled = false;

          loginBtn.innerHTML =
            "Access Dashboard";

          return;

        }

        // =========================
        // SAVE SESSION
        // =========================

        localStorage.setItem(
          "adminLoggedIn",
          "true"
        );

        localStorage.setItem(
          "adminEmail",
          email
        );

        // =========================
        // REDIRECT
        // =========================

        window.location.href =
          "admin.html";

      } catch (err) {

        console.error(err);

        loginMessage.innerHTML = `
          <div class="alert alert-danger rounded-4">
            ${err.message}
          </div>
        `;

        loginBtn.disabled = false;

        loginBtn.innerHTML =
          "Access Dashboard";

      }

    }
  );

}

</script>

</body>

</html>
