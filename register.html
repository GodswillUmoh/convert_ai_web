<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Register New Convert
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/styles.css"
  >

</head>

<body class="bg-light">
  <!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">

  <div class="container">

    <a class="navbar-brand fw-bold" href="index.html">
      RCCG Convert System
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      class="collapse navbar-collapse"
      id="navbarNav"
    >

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a
            class="nav-link"
            href="index.html"
          >
            Home
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            href="register.html"
          >
            Register Convert
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            href="feedback.html"
          >
            Pastor Feedback
          </a>
        </li>

      </ul>

    </div>

  </div>

</nav>


<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-8">

      <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-5">

          <h2 class="text-center text-danger fw-bold mb-2">
            RCCG New Convert Registration
          </h2>

          <p class="text-center text-muted mb-5">
            Kindly complete the form below.
          </p>

          <!-- GOOGLE FORM SUBMISSION -->

          <form
            id="convertForm"
            action="https://docs.google.com/forms/d/e/1FAIpQLSfxGehQmc0KfcchjclcnrJ_Qdl7k8SRQWj5XgFVantQkAGNng/formResponse"
            method="POST"
            target="_blank"
          >

            <div class="row g-4">

              <!-- FULL NAME -->

              <div class="col-md-6">

                <label class="form-label fw-semibold">
                  Full Name
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.140141326"
                  required
                >

              </div>

              <!-- EMAIL -->

              <div class="col-md-6">

                <label class="form-label fw-semibold">
                  Email Address
                </label>

                <input
                  type="email"
                  class="form-control form-control-lg"
                  name="entry.1150866650"
                  required
                >

              </div>

              <!-- PHONE -->

              <div class="col-md-6">

                <label class="form-label fw-semibold">
                  Phone Number
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.859141816"
                >

              </div>

              <!-- GENDER -->

              <div class="col-md-6">

                <label class="form-label fw-semibold">
                  Gender
                </label>

                <select
                  class="form-select form-select-lg"
                  name="entry.1090811495"
                >

                  <option value="">
                    Select Gender
                  </option>

                  <option value="Male">
                    Male
                  </option>

                  <option value="Female">
                    Female
                  </option>

                </select>

              </div>

              <!-- STATE -->

              <div class="col-md-6">

                <label class="form-label fw-semibold">
                  State
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1871222466"
                >

              </div>

              <!-- CITY -->

              <div class="col-md-6">

                <label class="form-label fw-semibold">
                  City
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.2068672242"
                >

              </div>

              <!-- LOCAL GOVERNMENT -->

              <div class="col-md-12">

                <label class="form-label fw-semibold">
                  Local Government
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.93196047"
                >

              </div>

              <!-- ADDRESS -->

              <div class="col-md-12">

                <label class="form-label fw-semibold">
                  Home Address
                </label>

                <textarea
                  class="form-control form-control-lg"
                  name="entry.1584247366"
                  rows="4"
                ></textarea>

              </div>

            </div>

            <!-- BUTTON -->

            <div class="mt-5 d-grid">

              <button
                type="submit"
                class="btn btn-danger btn-lg rounded-4"
                id="submitBtn"
              >
                Submit Information
              </button>

            </div>

          </form>

          <!-- MESSAGE -->

          <div
            id="messageBox"
            class="mt-4"
          ></div>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- SIMPLE SUBMIT SCRIPT -->

<script>

const convertForm =
  document.getElementById("convertForm");

const submitBtn =
  document.getElementById("submitBtn");

if (convertForm) {

  convertForm.addEventListener(
    "submit",
    function () {

      submitBtn.disabled = true;

      submitBtn.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Submitting...
      `;

      setTimeout(() => {

        submitBtn.disabled = false;

        submitBtn.innerHTML =
          "Submit Information";

      }, 4000);

    }
  );

}

</script>

</body>

</html>
