<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container-fluid">

  <div class="row min-vh-100">

    <div class="col-lg-2 bg-dark text-white p-4">

      <h3 class="fw-bold mb-5">RCCG Admin</h3>

      <ul class="nav flex-column gap-3">
        <li><a href="#" class="nav-link text-white">Dashboard</a></li>
        <li><a href="register.html" class="nav-link text-white">Add Convert</a></li>
        <li><a href="admin.html" class="nav-link text-white">Admin Dashboard</a></li>
      </ul>

    </div>

    <div class="col-lg-10 p-4 bg-light">

      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

        <h2 class="fw-bold text-danger">New Converts Dashboard</h2>

        <input
          type="text"
          id="searchInput"
          class="form-control w-auto"
          placeholder="Search convert..."
        >

      </div>

      <div class="row g-4 mb-4">

        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-4">
            <h5>Total Converts</h5>
            <h2 id="totalConverts">0</h2>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-4">
            <h5>Recent Submissions</h5>
            <h2 id="recentSubmissions">0</h2>
          </div>
        </div>

      </div>

      <div class="card border-0 shadow-sm">

        <div class="card-body">

          <div class="table-responsive">

            <table class="table table-hover align-middle">

              <thead class="table-danger">
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Local Government</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="convertTableBody"></tbody>

            </table>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
