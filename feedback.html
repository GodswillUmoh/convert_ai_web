<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Pastor Feedback Portal</title>

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="css/styles.css"
>

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">

  <div class="container">

    <a class="navbar-brand fw-bold" href="index.html">
      RCCG Convert System
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      class="collapse navbar-collapse"
      id="navbarNav"
    >

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="index.html">
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="register.html">
            Register Convert
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" href="feedback.html">
            Pastor Feedback
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="admin.html">
            Admin
          </a>
        </li>

      </ul>

    </div>

  </div>

</nav>

<!-- PAGE -->

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-10">

      <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-5">

          <h2 class="text-center text-danger fw-bold mb-2">
            Pastor Feedback Portal
          </h2>

          <p class="text-center text-muted mb-5">
            Kindly submit information about converts that visited your parish.
          </p>

          <form
            id="feedbackForm"
            action="https://docs.google.com/forms/d/e/1FAIpQLSeCxVXeBVi_GXZUOYPDtGYc67lhoZnwRkKsGhPMXjCEVL07Ug/formResponse"
            method="POST"
            target="hidden_iframe"
          >

            <div class="row g-4">

              <!-- Convert Name -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Convert Full Name
                </label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.716027578"
                  required
                >
              </div>

              <!-- Email -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Convert Email Address
                </label>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  name="entry.1966869854"
                >
              </div>

              <!-- Phone -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Convert Phone Number
                </label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.83016501"
                >
              </div>

              <!-- Gender -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Gender
                </label>

                <select
                  class="form-select form-select-lg"
                  name="entry.540175709"
                >
                  <option value="">Select Gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>

              <!-- Country -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Country
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1805903394"
                  value="Nigeria"
                >
              </div>

              <!-- State -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  State
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.592519137"
                >
              </div>

              <!-- City -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  City
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1270074033"
                >
              </div>

              <!-- Region -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Region
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1529263853"
                >
              </div>

              <!-- Zone -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Zone
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1597176789"
                >
              </div>

              <!-- Province -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Province
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1320051374"
                >
              </div>

              <!-- Local Government -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Local Government
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1181476120"
                >
              </div>

              <!-- Address -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Address
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1824948538"
                >
              </div>

              <!-- Parish -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  RCCG Parish Name
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.630627375"
                  required
                >
              </div>

              <!-- Pastor Name -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Pastor Name
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1849274708"
                  required
                >
              </div>

              <!-- Pastor Email -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Pastor Email
                </label>

                <input
                  type="email"
                  class="form-control form-control-lg"
                  name="entry.1610668247"
                >
              </div>

              <!-- Pastor Phone -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Pastor Phone
                </label>

                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="entry.1286409204"
                >
              </div>

              <!-- Visit -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Did the Convert Visit?
                </label>

                <select
                  class="form-select form-select-lg"
                  name="entry.334480027"
                >
                  <option value="">Select Option</option>
                  <option value="yes">Yes</option>
                  <option value="no">No</option>
                </select>
              </div>

              <!-- Follow Up -->

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Follow-up Status
                </label>

                <select
                  class="form-select form-select-lg"
                  name="entry.2107888472"
                >
                  <option value="in-progress">
                    In Progress
                  </option>

                  <option value="completed">
                    Completed
                  </option>

                  <option value="unreachable">
                    Unreachable
                  </option>

                </select>
              </div>

              <!-- Remark -->

              <div class="col-md-12">
                <label class="form-label fw-semibold">
                  Pastor Remark
                </label>

                <textarea
                  class="form-control form-control-lg"
                  rows="4"
                  name="entry.1083178585"
                ></textarea>
              </div>

            </div>

            <!-- Submit -->

            <div class="mt-5 d-grid">

              <button
                type="submit"
                class="btn btn-danger btn-lg rounded-4"
                id="submitBtn"
              >
                Submit Feedback
              </button>

            </div>

          </form>

          <!-- Hidden iframe -->

          <iframe
            name="hidden_iframe"
            id="hidden_iframe"
            style="display:none;"
          ></iframe>

          <!-- Messages -->

          <div
            id="messageBox"
            class="mt-4"
          ></div>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

const feedbackForm = document.getElementById("feedbackForm");
const submitBtn = document.getElementById("submitBtn");
const messageBox = document.getElementById("messageBox");

let submitted = false;

feedbackForm.addEventListener("submit", function() {

  submitted = true;

  submitBtn.disabled = true;

  submitBtn.innerHTML = `
    <span class="spinner-border spinner-border-sm"></span>
    Submitting...
  `;

});

document.getElementById("hidden_iframe").addEventListener("load", function() {

  if (!submitted) return;

  messageBox.innerHTML = `
    <div class="alert alert-success rounded-4 shadow-sm">
      <strong>Success!</strong><br>
      Feedback submitted successfully.
    </div>
  `;

  feedbackForm.reset();

  submitBtn.disabled = false;
  submitBtn.innerHTML = "Submit Feedback";

  submitted = false;

  setTimeout(() => {
    window.location.href = "success.html";
  }, 2500);

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
